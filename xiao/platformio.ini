; XIAO ESP32S3 Sense - live camera streaming over WiFi
; https://github.com/limengdu/SeeedStudio-XIAO-ESP32S3-Sense-camera

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; XIAO ESP32S3 Sense has 8MB octal-SPI PSRAM - must be told to init in
; "qio_opi" mode or the camera driver will fail to allocate frame buffers.
board_build.arduino.memory_type = qio_opi

; The camera + WiFi + HTTP server code doesn't fit the default OTA partition
; layout, so use the larger single-app scheme instead.
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    ; The XIAO S3 has no UART-to-USB bridge - Serial goes over native USB.
    ; Arduino IDE enables this via its "USB CDC On Boot" board menu option;
    ; PlatformIO needs these two defines set explicitly or Serial.print()
    ; output never reaches the USB port at all.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
